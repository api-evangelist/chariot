authentication:
  style: http-bearer
  header: 'Authorization: Bearer {TOKEN}'
  key_prefix_test: sk_test_
  transport: HTTPS TLS 1.2+ only
  oauth2: FDX API (open banking) uses OAuth 2.0 authorization_code with scopes read:bank_accounts and sync:connected_accounts
  cross_link: authentication/chariot-authentication.yml
idempotency:
  supported: true
  mechanism: Idempotency-Key request header on mutating operations
  header: Idempotency-Key
  applies_to:
    - createDisbursement
    - createInboundTransfer
  query_filter: listDisbursements accepts an idempotency_key query parameter to look up a prior create
  note: Send a unique Idempotency-Key on POST create operations so retries do not double-execute money movement.
  cross_link: errors/chariot-problem-types.yml
pagination:
  style: cursor
  request_params:
    - limit
    - cursor
  response_fields:
    - results
    - nextPageToken
  note: List endpoints return results[] plus nextPageToken; pass it back as cursor to page forward.
request_tracing:
  header: X-Request-Id
  direction: response
  note: Every response includes X-Request-Id; reference it in support requests.

aid: chariot
name: Chariot
description: >-
  Chariot is the leading payments platform for charitable giving, best known for DAFpay — the first
  donor-advised fund (DAF) payment option, named one of TIME's Best Inventions of 2025. Its REST API
  lets nonprofits, fundraising platforms, and grantmakers connect donor-advised funds, accept DAF
  donations through the embeddable Chariot Connect flow, move grant money via disbursements and
  inbound transfers, subscribe to webhook events, and read connected bank-account data through a
  Financial Data Exchange (FDX) v6 open-banking API. Chariot is building financial infrastructure
  for the multi-hundred-billion-dollar donor-advised fund market, the fastest-growing segment of
  philanthropy.
